spring:
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:jira-test;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  liquibase:
    change-log: classpath:db/changelog-h2.sql
  sql:
    init:
      mode: never
