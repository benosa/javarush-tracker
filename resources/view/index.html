<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="authUser" type="com.javarush.jira.login.AuthUser"*/-->

<th:block th:replace="~{layout/main::page(title=#{home.title},appMain=~{::appMain})}">
    <appMain>
        <h1 th:text="#{home.heading}">JiraRush</h1>
        <p th:text="#{home.description}"></p>
        <nav aria-label="Language"><a href="/?lang=ru">Русский</a> | <a href="/?lang=en">English</a></nav>
        <div th:if="${authUser} != null">
            <form action="/ui/logout" method="post">
                <button class="btn btn-primary btn-lg mt-3" type="submit" th:text="#{nav.logout}">Logout</button>
            </form>
        </div>
    </appMain>
</th:block>
