name: jirarush
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: ${DB_USER:-jira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/jira
      DB_USER: ${DB_USER:-jira}
      APP_URL: ${APP_URL:-http://localhost:8081}
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - attachments:/opt/jirarush/attachments
      - app-logs:/opt/jirarush/logs
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./resources/static:/opt/jirarush/resources/static:ro
      - ./resources/robots.txt:/opt/jirarush/resources/robots.txt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  postgres-data:
  attachments:
  app-logs:
